<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regional Geofencing — Verification</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
  <p class="step-label">STEP 2 OF 2</p>
  <h1>Two-Factor Verification</h1>
  <p class="subtitle">Enter the verification code</p>

  <form id="otpForm">
    <div class="field">
      <label for="otp">VERIFICATION CODE</label>
      <input type="text" id="otp" placeholder="Enter Code" inputmode="numeric" required>
    </div>


<button type="submit" class="btn-primary">VERIFY</button>


  </form>

  <p class="resend-link">
    <a href="#" id="resendLink">Resend Code</a>
  </p>
</div>

<div class="system-bar">
  <div class="brand-block">
    <div class="brand-name">REGIONAL GEOFENCING</div>
    <div class="brand-sub">Range &amp; Geofence Validation Framework</div>
  </div>

  <div class="system-status">
    <span class="status-dot"></span>
    SYSTEM READY
  </div>
</div>

<script>

if (!sessionStorage.getItem("otpCode") ||
    !sessionStorage.getItem("authenticatedUser")) {
  window.location.href = "auth-step-1.html";
}

document.getElementById("otpForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const entered = document.getElementById("otp").value.trim();
  const correct = sessionStorage.getItem("otpCode");

  if (entered === correct) {

    sessionStorage.removeItem("otpCode");
    sessionStorage.setItem("loginVerified", "true");

    window.location.href = "dashboard.html";

  } else {

    alert("Incorrect verification code. Please try again.");

  }

});

document.getElementById("resendLink").addEventListener("click", function(e) {

  e.preventDefault();

  const code = Math.floor(100000 + Math.random() * 900000).toString();

  sessionStorage.setItem("otpCode", code);

  alert("Your verification code is: " + code);

});

</script>

</body>
</html>
